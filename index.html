<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Bible Verse Quiz</title>
    <style>
        /* CSS: 디자인 수정 및 레이아웃 설정 */
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            /* 배경색을 연한 파란색(Light Blue)으로 변경 */
            --background: #eef2ff; 
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-light: #7f8c8d;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        .container {
            width: 90%;
            max-width: 550px;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem;
            /* 테두리를 30px로 더욱 둥글게 설정 */
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 1rem;
        }

        .reference-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            margin: 0;
        }

        .score-badge {
            background-color: var(--secondary);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .verse-container {
            margin-bottom: 2rem;
            line-height: 1.8;
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-main);
            min-height: 100px;
        }

        .blank {
            color: var(--secondary);
            border-bottom: 2px solid var(--secondary);
            padding: 0 10px;
        }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            margin-bottom: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.1);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1a252f;
        }

        #feedback {
            margin-top: 1.5rem;
            font-weight: bold;
            font-size: 1.1rem;
            height: 24px;
        }

        .correct { color: var(--success); }
        .incorrect { color: var(--error); }
        .hidden { display: none !important; }

        .result-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card" id="quiz-card">
        <div class="header-info">
            <h2 class="reference-title" id="reference">Bible Quiz</h2>
            <div class="score-badge" id="score-display">Score: 0 / 3</div>
        </div>
        
        <div class="verse-container" id="verse-display"></div>
        
        <input type="text" id="answer-input" placeholder="빈칸의 단어를 입력하세요" autocomplete="off">
        <button id="submit-btn" onclick="checkAnswer()">정답 확인</button>
        
        <div id="feedback"></div>
    </div>

    <div class="card hidden" id="result-card">
        <h1 class="result-title">Quiz Completed!</h1>
        <div class="verse-container" id="final-score-display"></div>
        <p id="result-message"></p>
        <button onclick="resetQuiz()">다시 시작하기</button>
    </div>
</div>

<script>
    const quizData = [
        {
            verse: "In the ________ God created the heavens and the earth.",
            answer: "beginning",
            ref: "Genesis 1:1"
        },
        {
            verse: "I am the way and the truth and the ____.",
            answer: "life",
            ref: "John 14:6"
        },
        {
            verse: "I can do all things through him who gives me ________.",
            answer: "strength",
            ref: "Philippians 4:13"
        }
    ];

    let currentIdx = 0;
    let score = 0;
    let isAnswered = false;

    function loadQuiz() {
        isAnswered = false;
        const currentQuiz = quizData[currentIdx];
        
        document.getElementById('reference').innerText = currentQuiz.ref;
        document.getElementById('score-display').innerText = `Score: ${score} / ${quizData.length}`;
        document.getElementById('verse-display').innerHTML = currentQuiz.verse.replace('________', '<span class="blank">________</span>').replace('____', '<span class="blank">____</span>');
        
        const inputField = document.getElementById('answer-input');
        inputField.value = '';
        inputField.disabled = false;
        inputField.focus();
        
        document.getElementById('feedback').innerText = '';
        document.getElementById('submit-btn').innerText = '정답 확인';
    }

    function checkAnswer() {
        if (isAnswered) return;
        isAnswered = true;

        const inputField = document.getElementById('answer-input');
        const inputVal = inputField.value.trim().toLowerCase();
        const correctAnswer = quizData[currentIdx].answer.toLowerCase();
        const feedback = document.getElementById('feedback');

        inputField.disabled = true;

        if (inputVal === correctAnswer) {
            score++;
            feedback.innerText = "정답입니다! 🎉";
            feedback.className = "correct";
        } else {
            feedback.innerText = `오답입니다. 정답은 '${quizData[currentIdx].answer}' 입니다.`;
            feedback.className = "incorrect";
        }

        document.getElementById('score-display').innerText = `Score: ${score} / ${quizData.length}`;
        document.getElementById('submit-btn').innerText = '다음 문제로...';

        setTimeout(() => {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuiz();
            } else {
                showResult();
            }
        }, 2000);
    }

    function showResult() {
        document.getElementById('quiz-card').classList.add('hidden');
        document.getElementById('result-card').classList.remove('hidden');
        document.getElementById('final-score-display').innerText = `최종 점수: ${score} / ${quizData.length}`;

        const messageEl = document.getElementById('result-message');
        if (score === quizData.length) {
            messageEl.innerText = "완벽합니다! 모든 구절을 마스터하셨네요. 🌟";
        } else {
            messageEl.innerText = "수고하셨습니다! 다시 한 번 도전해보세요. 📖";
        }
    }

    function resetQuiz() {
        currentIdx = 0;
        score = 0;
        document.getElementById('quiz-card').classList.remove('hidden');
        document.getElementById('result-card').classList.add('hidden');
        loadQuiz();
    }

    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });

    loadQuiz();
</script>

</body>
</html>
